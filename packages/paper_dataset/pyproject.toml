[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-dataset"
version = "0.1.0"
description = "Module for managing paper datasets and processing academic papers"
authors = [
    {name = "Research Team", email = "research@university.edu"}
]
requires-python = ">=3.10"

dependencies = [
    # Core data processing
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "datasets>=2.0.0",
    "pyarrow>=14.0.0",
    # PDF processing
    "pdfplumber>=0.10.0",
    "pymupdf>=1.23.0",
    "pdf2image>=1.16.0",
    "pytesseract>=0.3.13",
    # ML and NLP
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "spacy>=3.7.0",
    # Configuration and utilities
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
    "psutil>=5.9.0",
    # Multiprocessing and concurrency
    "multiprocessing-logging>=0.3.0",
    "python-dotenv>=1.1.1",
    "pip>=25.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_dataset*"]

[project]
name = "paper-classifier"
version = "0.1.0"
description = "A clean Mamba-based text classification system for academic papers"
requires-python = ">=3.13"
dependencies = [
    "accelerate",
    "bitsandbytes>=0.47.0",
    "duckdb>=1.3.2",
    "evaluate",
    "mamba-ssm",
    "numpy",
    "pandas>=2.3.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "scikit-learn",
    "torch",
    "wandb>=0.21.2",
    "transformers",
    "datasets",
    "huggingface-hub",
    # Web interface dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
]

[project.scripts]
train-paper-classifier = "paper_classifier.main:main"
list-paper-models = "paper_classifier.model_manager:main"
classify-paper = "paper_classifier.cli_inference:main"
classify-paper-web = "paper_classifier.web_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
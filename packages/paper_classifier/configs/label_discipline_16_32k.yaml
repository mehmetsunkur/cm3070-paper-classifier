# Configuration for 16-32k dataset experiment
# Extends label_discipline.yaml with size-specific overrides
# Shared settings for ALL 16-32k variants (s1000, s5000, etc.)

extends: label_discipline.yaml

subset_generation:
  # Override size rank for this experiment
  size_rank: 16-32k
  # Note: sample_count is NOT specified here - varies per variant (s1000, s5000, etc.)

data:
  max_seq_length: auto  # Explicitly set max sequence length
  
training:
  # Batch size and accumulation (adjusted for 16-32k range)
  batch_size_train: 1
  batch_size_eval: 1
  gradient_accumulation_steps: 6
  
  # Learning rate and optimization
  learning_rate: 0.00001
  max_grad_norm: 1.0
  
  # Training duration
  num_epochs: 15
  
evaluation:
  # Override early stopping for this larger dataset
  early_stopping_patience: 2
  early_stopping_threshold: 0.01
  
logging:
  # Experiment-specific notes
  wandb_notes: "16-32k dataset: larger batch, max_seq=auto"
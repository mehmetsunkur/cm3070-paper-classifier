# Configuration for 8-16k dataset experiment
# Extends label_discipline.yaml with size-specific overrides

extends: label_discipline.yaml

subset_generation:
  # Override size rank for this experiment
  size_rank: 8-16k

data:
  max_seq_length: auto  # Explicitly set max sequence length
  
training:
  # Batch size and accumulation
  batch_size_train: 4
  batch_size_eval: 4
  gradient_accumulation_steps: 8
  
  # Learning rate and optimization (using defaults from base)
  max_grad_norm: 1.0
  
  # Training duration
  num_epochs: 20
  
evaluation:
  # Override early stopping for this larger dataset
  early_stopping_patience: 2
  early_stopping_threshold: 0.01
  
logging:
  # Experiment-specific notes
  wandb_notes: "8-16k dataset: smaller batch, max_seq=4096"
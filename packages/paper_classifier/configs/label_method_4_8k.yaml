# Configuration for 4-8k dataset experiment
# Extends label_method.yaml with size-specific overrides
# Shared settings for ALL 4-8k variants (s1000, s5000, etc.)

extends: label_method.yaml

subset_generation:
  # Override size rank for this experiment
  size_rank: 4-8k
  # Note: sample_count is NOT specified here - varies per variant (s1000, s5000, etc.)
  
training:
  # Batch size and accumulation (common for 4-8k range)
  batch_size_train: 11
  batch_size_eval: 11
  gradient_accumulation_steps: 10
  
  # Learning rate and optimization
  learning_rate: 0.00001
  max_grad_norm: 0.5
  
  # Training duration
  num_epochs: 30
  
logging:
  # Experiment-specific notes
  wandb_notes: "4-8k dataset: LR=1e-5, grad_clip=0.5, FP16_O1"
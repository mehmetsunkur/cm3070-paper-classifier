# Experiment Configuration

experiment:
  name: "Paper Download Feasibility Study"
  max_papers_per_api: 50
  test_mode_papers: 5
  
apis:
  arxiv:
    enabled: true
    categories:
      - "cs.LG"  # Machine Learning
      - "cs.AI"  # Artificial Intelligence
      - "cs.SE"  # Software Engineering
      - "cs.HC"  # Human-Computer Interaction
      - "cs.DB"  # Databases
      - "cs.CL"  # Computation and Language (NLP)
      - "cs.CV"  # Computer Vision
      - "cs.DC"  # Distributed Computing
      - "cs.IR"  # Information Retrieval
      - "cs.NI"  # Networking and Internet Architecture
      - "cs.CR"  # Cryptography and Security
      - "cs.DS"  # Data Structures and Algorithms
      - "cs.PL"  # Programming Languages
      - "cs.RO"  # Robotics
      - "cs.CY"  # Computers and Society
    papers_per_category: 10  # This is now only used as a fallback
    
  semantic_scholar:
    enabled: true
    queries:
      - "information systems case study"
      - "software engineering methodology"
      - "IT governance framework"
    papers_per_query: 10
    api_key: "${SEMANTIC_SCHOLAR_API_KEY}"  # From .env file
    
  crossref:
    enabled: true
    queries:
      - "experimental computer science"
      - "survey information technology"
    papers_per_query: 10
    
  paperswithcode:
    enabled: true
    max_papers: 20

download:
  timeout_seconds: 30
  max_retries: 3
  retry_delay: 1.0
  rate_limit_delay: 0.5  # Delay between requests
  
validation:
  min_file_size_kb: 50  # Minimum PDF size
  max_file_size_mb: 50  # Maximum PDF size
  check_pdf_validity: true
  extract_text: true
  
storage:
  data_dir: "./data"
  keep_failed_downloads: true
  organize_by_api: true
  
logging:
  level: "INFO"
  log_to_file: true
  log_dir: "./logs"
  
metrics:
  track_download_time: true
  track_metadata_completeness: true
  generate_report: true
  output_format: ["json", "markdown", "csv"]
[project]
name = "paper-download"
version = "1.0.2"
description = "CLI tool for downloading computing research papers from ArXiv"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Mehmet Sunkur"}]
keywords = ["research", "papers", "arxiv", "classification", "cli", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "pandas>=2.1.0",
    "pymupdf>=1.23.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "psutil>=7.0.0",
]

[project.scripts]
paper-download = "paper_download.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
notebook = [
    "notebook>=7.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "ipykernel>=6.25.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ipython>=8.12.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_download"]